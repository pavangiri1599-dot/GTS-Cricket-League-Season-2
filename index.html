<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>GTS Cricket League Season 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070a14;--p:#0e1426;--tx:#f2f5ff;--mut:#8a94b8;--gold:#ffc83d;--gold2:#ff9a1f;--ln:#ffffff1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{height:100%;background:var(--bg) radial-gradient(1100px 560px at 50% -10%,#1b2a6b66,transparent),radial-gradient(800px 500px at 100% 100%,#6b1b4a44,transparent);color:var(--tx);font:600 16px Rajdhani,system-ui,sans-serif;overflow:hidden}
.bn,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.04em}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-auto-rows:auto;gap:10px;padding:10px 14px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:clamp(24px,3.2vw,46px);background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.live{display:flex;align-items:center;gap:6px;color:#ff4d5e;font-weight:700;letter-spacing:.15em}
.live i{width:10px;height:10px;border-radius:50%;background:#ff4d5e;animation:pl 1.3s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #ff4d5e99}100%{box-shadow:0 0 0 10px #ff4d5e00}}
nav{display:flex;gap:6px}
nav button,.btn,select{font:700 15px Rajdhani,sans-serif;color:var(--tx);background:#ffffff0f;border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.15s}
nav button:hover,.btn:hover{background:#ffffff22}nav button.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.stats{margin-left:auto;display:flex;gap:22px}
.stat b{display:block;font:400 clamp(22px,2.6vw,36px)/1 'Bebas Neue',sans-serif;color:var(--gold)}
.stat span{font-size:12px;color:var(--mut);letter-spacing:.1em}
.present nav,.present #bids,.present #ctl{display:none}
body:not([data-v=auction]) #bids,body:not([data-v=auction]) #ctl{display:none}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,27vw);gap:12px;min-height:0}
.stage{--c:#ffc83d;position:relative;border-radius:26px;display:grid;place-items:center;text-align:center;overflow:hidden;padding:14px;min-height:0;background:#0b1124}
.stage:before{content:"";position:absolute;inset:-60%;background:conic-gradient(transparent,var(--c),transparent 30%,#fff3,transparent 60%,var(--c),transparent);animation:sp 8s linear infinite;opacity:.8}
.stage:after{content:"";position:absolute;inset:3px;border-radius:23px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 24%,#0b1124),#0b1124 72%)}
@keyframes sp{to{transform:rotate(1turn)}}
.stage>div{position:relative;z-index:2;max-width:100%}
.cat{display:inline-block;padding:6px 20px;border-radius:99px;font-size:clamp(14px,1.6vw,24px);letter-spacing:.16em;border:2px solid;background:#00000055}
.pname{font-size:clamp(54px,9.5vw,170px);line-height:.95;margin:.1em 0;text-shadow:0 6px 40px #000}
.base{color:var(--mut);font-size:clamp(16px,1.8vw,28px)}
.lbl{margin-top:2vh;color:var(--mut);letter-spacing:.3em;font-size:clamp(13px,1.4vw,22px)}
.bid{font-size:clamp(70px,14vw,250px);line-height:1;background:linear-gradient(180deg,#fff,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px color-mix(in srgb,var(--c) 70%,transparent))}
.bump{animation:bp .45s cubic-bezier(.2,1.7,.4,1)}@keyframes bp{0%{transform:scale(1.2)}100%{transform:scale(1)}}
.lead{margin-top:1vh;font-size:clamp(18px,2.4vw,38px);min-height:1.4em}
.lead b{padding:4px 22px;border-radius:12px;background:var(--c);color:#0a0f22;font:400 1.15em 'Bebas Neue',sans-serif;letter-spacing:.05em;box-shadow:0 0 40px var(--c)}
.hist{margin-top:1.4vh;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:clamp(13px,1.3vw,20px)}
.hist span{padding:2px 12px;border-radius:8px;background:#ffffff10;border-left:4px solid var(--c);opacity:.9}
#idle .big{font-size:clamp(40px,6vw,110px);line-height:1}#idle p{color:var(--mut);font-size:clamp(16px,2vw,30px);margin-top:1vh}
.teams{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.tc{--c:#fff;flex:1;min-height:70px;border-radius:16px;background:var(--p);border:1px solid var(--ln);border-left:7px solid var(--c);padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:.3s}
.tc.lead{box-shadow:0 0 0 2px var(--c),0 0 36px -4px var(--c);background:color-mix(in srgb,var(--c) 14%,var(--p));transform:scale(1.02)}
.tc .r1,.tc .r2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tc .r1 b{font-size:clamp(20px,2vw,32px);color:var(--c)}.tc .r1 em{font:400 clamp(22px,2.2vw,36px) 'Bebas Neue',sans-serif;font-style:normal}
.tc .r2{font-size:clamp(12px,1vw,16px);color:var(--mut)}
.meter{height:7px;border-radius:9px;background:#ffffff14;overflow:hidden}.meter i{display:block;height:100%;background:var(--c);transition:width .6s}
.bids{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tb{--c:#fff;position:relative;border:0;border-radius:14px;padding:10px 8px;cursor:pointer;background:var(--c);color:#0a0f22;font:700 15px Rajdhani,sans-serif;display:flex;flex-direction:column;align-items:center;transition:.12s}
.tb b{font:400 clamp(18px,1.9vw,28px) 'Bebas Neue',sans-serif;letter-spacing:.04em}.tb:hover{transform:translateY(-3px)}.tb:active{transform:scale(.96)}
.tb kbd{position:absolute;left:8px;top:6px;font-size:12px;opacity:.6}.tb:disabled{opacity:.25;cursor:not-allowed;transform:none}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn kbd,.ctl kbd{font-size:11px;opacity:.6;margin-left:4px}
.btn.pri{background:linear-gradient(90deg,#4da3ff,#7c5cff);border:0}.btn.go{background:linear-gradient(90deg,#1fbf6b,#8be04a);color:#06200f;border:0;font-size:18px}
.btn:disabled{opacity:.3;cursor:not-allowed}.chips{display:flex;gap:4px;margin-right:auto}.chips button{padding:6px 10px}.chips button.on{background:var(--gold);color:#1a1200}
select{padding:8px}option{background:#0e1426}
.tick{overflow:hidden;white-space:nowrap;border-top:1px solid var(--ln);padding-top:6px;color:var(--mut);font-size:clamp(14px,1.4vw,20px)}
.track{display:inline-block;animation:mq 45s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.track span{margin:0 28px}.track b{color:var(--gold)}
.sq{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0;overflow:auto}
.sc{--c:#fff;background:var(--p);border:1px solid var(--ln);border-top:6px solid var(--c);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;gap:3px;min-height:0}
.sc h3{font-size:clamp(22px,2.4vw,36px);color:var(--c);line-height:1}.sc h3 small{font:600 13px Rajdhani;color:var(--mut);margin-left:10px;letter-spacing:0}
.sl{flex:1;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:8px;background:#ffffff0c;font-size:clamp(13px,1.25vw,19px);min-height:0}
.sl i{width:8px;height:60%;border-radius:4px}.sl b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl small{color:var(--mut);font-size:.8em}.sl em{font-style:normal;color:var(--gold)}
.sl.e{color:#ffffff40;border:1px dashed #ffffff22;background:none;justify-content:center}
.ft{display:flex;justify-content:space-between;color:var(--mut);font-size:clamp(13px,1.2vw,18px);padding-top:3px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:16px;overflow:auto;min-height:0}.set .col{display:flex;flex-direction:column;gap:10px}
.set label{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:14px}
.set input,.set textarea{font:600 15px Rajdhani,sans-serif;color:var(--tx);background:#ffffff0c;border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#ov{--c:#fff;position:fixed;inset:0;z-index:50;display:grid;place-content:center;text-align:center;cursor:pointer;background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,#050814),#050814f4 72%);animation:fi .3s}@keyframes fi{from{opacity:0}}
.stamp{font-size:clamp(90px,21vw,340px);line-height:.9;color:var(--c);text-shadow:0 0 70px var(--c);animation:st .7s cubic-bezier(.2,1.8,.4,1) both}
@keyframes st{0%{transform:scale(4) rotate(-22deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
#ov.unsold .stamp{color:#8a94b8;text-shadow:none}
#ov .on{font-size:clamp(40px,7vw,120px)}#ov .to{font-size:clamp(20px,3vw,48px);color:var(--mut)}#ov .pr{font-size:clamp(60px,11vw,190px);color:var(--gold);text-shadow:0 0 50px #ffc83d88}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.btn.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}.btn.no{background:#ff4d5e22;border-color:#ff4d5e;color:#ff8a96;font-size:18px}
.pv{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.pr{display:grid;grid-template-columns:2fr 1.3fr .9fr 1.6fr .9fr .8fr minmax(340px,auto);gap:8px;align-items:center}
.pr.h{position:sticky;top:0;background:var(--bg);color:var(--mut);font-size:13px;padding:6px 0;z-index:2}
.pr input,.pr select{width:100%;font:600 15px Rajdhani,sans-serif;color:var(--tx);background:#ffffff0c;border:1px solid var(--ln);border-radius:8px;padding:6px 8px}
.pr .ac{display:flex;gap:6px}.pr .ac .btn{padding:5px 10px;font-size:13px;white-space:nowrap}
.stt{font-size:13px;padding:2px 10px;border-radius:99px;text-align:center}.stt.s{background:#1fbf6b33;color:#7dffb0}.stt.u{background:#ff4d5e33;color:#ff8a96}.stt.p{background:#ffffff14}
.sl .x{border:0;background:#ff4d5e22;color:#ff8a96;border-radius:6px;cursor:pointer;font:700 13px Rajdhani,sans-serif;padding:2px 8px}.sl .x:hover{background:#ff4d5e;color:#fff}.sl .x.arm{background:#ff4d5e;color:#fff}.present .sl .x{display:none}
html{background:#070a14}
.ro #bids,.ro #ctl,.ro .sl .x,.ro nav [data-v=unsold],.ro nav [data-v=players],.ro nav [data-v=setup]{display:none}
@media(max-width:900px){body{overflow:auto}.app{height:auto}.main,.set{grid-template-columns:1fr}.pr{grid-template-columns:1fr 1fr}.pr.h{display:none}.sq{grid-template-columns:1fr}.bids{grid-template-columns:repeat(2,1fr)}.stats{margin-left:0}}
@media(prefers-reduced-motion:reduce){.stage:before,.track,.live i{animation:none}}
</style></head>
<body data-v="auction">
<div class="app" id="app">
<header>
 <div class="logo bn" id="ttl"></div><div class="live"><i></i>LIVE</div>
 <nav id="nav"><button data-v="auction">Auction</button><button data-v="squads">Squads</button><button data-v="unsold">Unsold</button><button data-v="players">Players</button><button data-v="setup">Setup</button></nav>
 <div class="stats" id="stats"></div>
</header>
<section class="main" id="v-auction">
 <div class="stage" id="stage">
  <div id="idle"></div>
  <div id="live" hidden><span class="cat" id="cat"></span><div class="pname bn" id="pname"></div><div class="base" id="base"></div><div class="lbl" id="lbl"></div><div class="bid bn" id="bid"></div><div class="lead" id="lead"></div><div class="hist" id="hist"></div></div>
 </div>
 <div class="teams" id="teams"></div>
</section>
<section id="v-squads" hidden style="display:contents"></section>
<section id="v-setup" hidden style="display:contents"></section>
<section id="v-players" hidden style="display:contents"></section>
<div class="bids" id="bids"></div>
<div class="ctl" id="ctl">
 <div class="chips" id="incs"></div>
 <select id="filt"></select>
 <button class="btn pri" id="bDraw">🎲 Draw next<kbd>N</kbd></button>
 <button class="btn go" id="bSold">🔨 SOLD<kbd>S</kbd></button>
 <button class="btn no" id="bUns">⏭ Unsold<kbd>U</kbd></button>
 <button class="btn" id="bUb">↶ Bid<kbd>Z</kbd></button>
 <button class="btn" id="bUs">↶ Sale<kbd>X</kbd></button>
 <button class="btn" id="bMute">🔊<kbd>M</kbd></button>
 <button class="btn" id="bPres">🖥 Present<kbd>H</kbd></button>
 <button class="btn" id="bDisp">Open display ↗</button>
</div>
<div class="tick"><div class="track" id="tick"></div></div>
</div>
<div id="ov" hidden></div><canvas id="cf"></canvas>
<script>
const $=s=>document.querySelector(s),K='gts-auction-v3',DISP=location.hash==='#display';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN');
const CATS={'Icon':['⭐','#ffc83d',40000],'Owner':['👑','#ff4d6d',30000],'All Rounder':['⚡','#ff9a1f',20000],'Batsman':['🏏','#4da3ff',15000],'Bowler':['🎯','#3ee08a',10000],'Female Player':['💫','#ff7ad9',2000],'New Player':['🌱','#9aa7c7',5000]};
const PAL=['#4da3ff','#5ee38b','#ffd54a','#ff6b5e','#b47cff','#2ee6d0','#ff8fd0','#c0ff6b'];
const norm=s=>{s=(s||'').toLowerCase();return /icon/.test(s)?'Icon':/owner/.test(s)?'Owner':/all|^ar$/.test(s)?'All Rounder':/bat/.test(s)?'Batsman':/bowl/.test(s)?'Bowler':/fem|wom/.test(s)?'Female Player':'New Player'};
const T0=`Tejas & Rohit,Icon · Suraj Panchal,#4da3ff
Avneesh & Vinay,Icon · Vishal Tiwari,#5ee38b
Manmohan / Nahas / Priya Singh,Icon · Mandar Ghugare,#ffd54a
Rakshit & Pallavi,Icon · Nishant Patil,#ff6b5e
Ashutosh & Alok,Icon · Sanil Gaikwad,#b47cff
Sudip,Icon · Pavan Giri,#2ee6d0`;
const P0=("Suraj Panchal,Icon,40000,1,40000;Vishal Tiwari,Icon,40000,2,40000;Mandar Ghugare,Icon,40000,3,40000;Nishant Patil,Icon,40000,4,40000;Sanil Gaikwad,Icon,40000,5,40000;Pavan Giri,Icon,40000,6,40000;Tejas Sawant,Owner,30000,1,30000;Rohit Singh,Owner,30000,1,30000;Nahas Khalid,Owner,30000,3,30000;Rakshit Deshmukh,Owner,30000,4,30000;Pallavi Kudtarkar,Female Owner,15000,4,15000;Nevedita Kale,Female;Kalyani Dhoke,Female;Aditi Dalvi,Female;Priya Chaudhary,Female;Simran Datkhile,Female;Rupesh Gawli,AR;Viral Bhatt,AR;Prashant Shinde,AR;Pravin Kore,AR;Larry D'Cruz,Bat;Rohan Bhanushali,Bat;Kunal Tawate,Bat;Sanjay Gupta,Bat;Sandeep Santhanam,Bat;Gunaseelan V,Bat;Nilesh Shinde,Bat;Pronnoy Choudhury,Bat;Deepak Hirawat,Bat;Pavan Mokashi,Bat;Tushar Gaikwad,Bat;Pushkar Pillewar,Bat;Suraj Nishad,Bat;Omkar Madhvi,Bat;Sonu Thakur,Bat;Yashraj Salian,Bowl;Rahul Patil,Bowl;Mandar Jawalkar,Bowl;Sunny Mishra,Bowl;Viraj Raorane,Bowl;Om Patel,Bowl;Sarvar Nivsekar,Bowl;Aman Bajaj,Bowl;Sunny Kumar,Bowl;Kunal Mittal,New;Prashant Kasbe,New;Anshuman Mukherjee,New;Nilesh Upsham,New").split(';').join('\n');
let S,seen=0,reeling=false,mute=false,AC,ovT,shown=0,DB=null,RO=false,DBOK=false,lastJ='',wBusy=false,wPend=false,LV=null,first=true;
function build(cfg,tt,pt){S={cfg,teams:tt.split('\n').map(l=>l.trim()).filter(Boolean).slice(0,8).map((l,i)=>{const[a,b,c]=l.split(',').map(x=>x.trim());return{id:i,name:a,owner:b||'',color:/^#[0-9a-f]{6}$/i.test(c||'')?c:PAL[i]}}),players:pt.split('\n').map(l=>l.trim()).filter(Boolean).map((l,i)=>{const[a,b,c,d,e]=l.split(',').map(x=>x.trim());const cat=norm(b),tm=parseInt(d)-1,fx=tm>=0&&tm<8,bp=+c||CATS[cat][2];return{id:i,name:a,cat,base:bp,team:fx?tm:-1,price:fx?(+e||bp):0,st:fx?'s':'p',f:/fem|wom/i.test(b||'')}}),cur:null,sales:[],ev:null,view:'auction',filt:'',rv:2}}
function reset(){build({title:'GTS PREMIER LEAGUE',purse:200000,squad:8,inc:1000,reserve:2000},T0,P0)}
try{S=JSON.parse(localStorage.getItem(K));if(!S||!S.teams)S=null}catch(e){S=null}
if(!S)reset();
S.teams.forEach(t=>{if(t.name==='Manmohan'&&/Nahas/.test(t.owner)){t.name='Manmohan / Nahas / Priya Singh';t.owner='Icon · Mandar Ghugare'}});
if(DISP)document.body.classList.add('present');
seen=S.ev?S.ev.ts:0;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
if(S.rv!==2){S.players.forEach(p=>{if(p.cat==='Female Player'||/pallavi/i.test(p.name))p.f=true;if(!(p.st==='s'&&!S.sales.includes(p.id)))p.base=CATS[p.cat][2]});S.cfg.reserve=2000;S.cfg.inc=Math.max(1000,S.cfg.inc||1000);S.rv=2;save()}
const pl=id=>S.players[id],tp=t=>S.players.filter(p=>p.team===t.id),spent=t=>tp(t).reduce((a,p)=>a+p.price,0),purse=t=>S.cfg.purse-spent(t),slots=t=>S.cfg.squad-tp(t).length;
const mb=(t,p)=>Math.max(0,purse(t)-((p&&p.f)||tp(t).some(x=>x.f)?0:S.cfg.reserve)),maxBid=t=>mb(t,S.cur&&pl(S.cur.pid)),roster=t=>S.players.filter(p=>p.team===t.id&&!S.sales.includes(p.id)).concat(S.sales.map(pl).filter(p=>p.team===t.id));
const nextBid=t=>S.cur.lead===null?pl(S.cur.pid).base:S.cur.bid+S.cfg.inc;
const canBid=t=>S.cur&&!reeling&&S.cur.lead!==t.id&&nextBid(t)<=maxBid(t);
function beep(f=660,d=.12,ty='sine',v=.09){if(mute)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function bid(i){const t=S.teams[i];if(!t)return;if(!canBid(t)){beep(180,.2,'square',.05);return}S.cur.bid=nextBid(t);S.cur.lead=t.id;S.cur.hist.unshift([t.id,S.cur.bid]);beep(520+S.cur.hist.length*25,.1,'triangle');save();render()}
function sold(){const c=S.cur;if(!c||c.lead===null)return;const p=pl(c.pid);p.team=c.lead;p.price=c.bid;p.st='s';S.sales.push(p.id);S.ev={k:'sold',pid:p.id,t:c.lead,price:c.bid,ts:Date.now()};S.cur=null;save();render()}
function unsold(){const c=S.cur;if(!c)return;const p=pl(c.pid);p.st='u';S.ev={k:'unsold',pid:p.id,t:-1,price:0,ts:Date.now()};S.cur=null;save();render()}
function undoBid(){const c=S.cur;if(!c||!c.hist.length)return;c.hist.shift();if(c.hist.length){c.lead=c.hist[0][0];c.bid=c.hist[0][1]}else{c.lead=null;c.bid=pl(c.pid).base}save();render()}
function undoSale(){if(S.cur||!S.sales.length)return;const p=pl(S.sales.pop()),t=p.team,pr=p.price;p.team=-1;p.price=0;p.st='p';S.cur={pid:p.id,bid:pr,lead:t,hist:[[t,pr]]};S.ev=null;save();render()}
function draw(){if(reeling||S.cur)return;let pool=S.players.filter(p=>p.st==='p'&&p.cat!=='Icon'&&p.cat!=='Owner'&&(!S.filt||p.cat===S.filt));
 if(!pool.length){const u=S.players.filter(p=>p.st==='u');if(u.length){u.forEach(p=>p.st='p');S.acc=true;save();render()}return}
 const pick=pool[Math.floor(Math.random()*pool.length)];reeling=true;render();let n=0;
 const iv=setInterval(()=>{const r=pool[Math.floor(Math.random()*pool.length)];$('#pname').textContent=r.name;$('#cat').textContent=CATS[r.cat][0]+' '+r.cat.toUpperCase();$('#cat').style.color=CATS[r.cat][1];beep(300+n*18,.05,'square',.03);if(++n>26){clearInterval(iv);reeling=false;S.cur={pid:pick.id,bid:pick.base,lead:null,hist:[]};beep(880,.25,'triangle');save();render()}},70)}

 const rs=S.sales.slice(-10).reverse().map(id=>{const p=pl(id);if(p.team<0)return'';return`<span>🔨 ${esc(p.name)} → <b>${esc(S.teams[p.team].name)}</b> ${fmt(p.price)}</span>`}).join('')||`<span>Welcome to the ${esc(S.cfg.title)} auction</span><span>${S.teams.length} teams</span><span>${S.players.length} players</span><span>${fmt(S.cfg.purse)} purse each</span>`;

function showEv(){const e=S.ev,ov=$('#ov');if(!e||e.ts<=seen||Date.now()-e.ts>20000)return;seen=e.ts;const p=pl(e.pid),t=e.t>=0?S.teams[e.t]:null;

 ov.hidden=false;if(t){boom(t.color);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.35,'triangle',.1),i*130))}else beep(150,.5,'sawtooth',.06);

function go(v){if(RO){LV=v==='squads'?'squads':'auction';render();return}if(v==='unsold'){S.pf='u';v='players'}else if(v==='players')S.pf='';S.view=v;save();render();if(v==='setup')fillSetup()}
