<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>GTS Cricket League Season 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap"

    <link href="./assets/styles.css" rel="stylesheet">
</head>

<body data-v="auction" class="min-h-dvh bg-bg font-sans text-base font-semibold leading-normal text-ink antialiased">
    <div class="app mx-auto flex min-h-dvh w-full max-w-[1920px] flex-col gap-4 px-3 pb-[max(1rem,env(safe-area-inset-bottom))] pt-[max(1rem,env(safe-area-inset-top))] sm:px-6 lg:gap-5" id="app">

                <div class="flex min-w-0 flex-1 flex-col gap-1">

                    <div class="live flex items-center gap-2 text-xs font-bold tracking-widest text-rose-300 sm:text-sm"><i></i>LIVE</div>
                </div>
            </div>
            <nav id="nav" aria-label="Main navigation" class="flex w-full flex-wrap gap-2 lg:ml-auto lg:w-auto"><button data-v="auction">Auction</button><button data-v="squads">Squads</button><button
                    data-v="unsold">Unsold</button><button data-v="players">Players</button><button
                    data-v="setup">Setup</button></nav>
            <button id="bAccess" class="btn" aria-expanded="false" aria-controls="auth-panel">Unlock editing</button>

                <button class="btn pri" type="submit">Unlock editing</button>
                <p id="login-message" role="status" class="text-sm text-muted"></p>
            </form>
        </section>
        <section class="grid min-w-0 grid-cols-1 items-start gap-4 xl:grid-cols-[minmax(0,1.65fr)_minmax(0,1fr)]" id="v-auction">
            <div class="stage relative flex min-h-[340px] min-w-0 items-center justify-center rounded-3xl border-2 px-4 py-8 text-center sm:min-h-[420px] sm:px-8" id="stage">

                    <div class="my-4 break-words text-[clamp(2.5rem,6vw,6rem)] leading-[1.25] [overflow-wrap:anywhere] font-display font-normal tracking-wide" id="pname"></div>
                    <div class="text-base text-muted sm:text-xl" id="base"></div>
                    <div class="mt-5 text-xs font-bold tracking-[.2em] text-muted sm:text-sm" id="lbl"></div>
                    <div class="py-2 text-[clamp(3rem,8vw,8rem)] leading-[1.1] tabular-nums text-gold font-display font-normal tracking-wide [overflow-wrap:anywhere]" id="bid"></div>
                    <div class="mt-5 min-w-0" id="lead" role="status" aria-live="polite" aria-atomic="true"></div>
                </div>
            </div>
            <div class="flex min-w-0 flex-wrap items-center gap-2 xl:col-start-1 xl:row-start-3" id="ctl" aria-label="Auction controls">
                <div class="flex w-full flex-wrap gap-2">
                    <button class="btn pri" id="bDraw">Draw next<kbd>N</kbd></button>
                    <button class="btn go" id="bSold">SOLD<kbd>S</kbd></button>
                    <button class="btn no" id="bUns">Unsold<kbd>U</kbd></button>

                <select id="filt" aria-label="Filter draw by category" class="w-full sm:w-auto"></select>

                <button class="btn" id="bUs">Undo sale<kbd>X</kbd></button>
                <button class="btn" id="bMute">Sound on<kbd>M</kbd></button>
                <button class="btn" id="bPres" aria-pressed="false">Present<kbd>H</kbd></button>
                <button class="btn" id="bDisp">Open display ↗</button>
                <button class="btn" id="bShare">Copy viewing link</button>
            </div>
            <div class="grid grid-cols-2 gap-2 md:grid-cols-3 xl:col-start-1 xl:row-start-2 2xl:grid-cols-[repeat(var(--team-count,6),minmax(0,1fr))]" id="bids" aria-label="Team bids"></div>
            <div class="grid min-w-0 grid-cols-1 gap-3 md:grid-cols-2 xl:col-start-2 xl:row-start-1 xl:row-span-3 xl:grid-cols-1" id="teams"></div>
        </section>
        <section id="v-squads" hidden class="min-w-0"></section>
        <section id="v-setup" hidden class="min-w-0"></section>
        <section id="v-players" hidden class="min-w-0"></section>
        <div class="mt-auto min-w-0 rounded-xl border border-line bg-panel px-4 py-3 text-sm text-muted">
            <div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2" id="tick"></div>
        </div>
    </div>
    <button id="bExitPres" hidden class="btn fixed bottom-[max(1rem,env(safe-area-inset-bottom))] right-4 z-40 border-gold bg-panel shadow-lg">Exit presentation</button>
    <div id="ov" hidden class="fixed inset-0 z-50 overflow-y-auto p-4" role="dialog" aria-modal="true" aria-labelledby="result-title"></div><canvas id="cf" class="pointer-events-none fixed inset-0 z-40 h-full w-full" aria-hidden="true"></canvas>
    <script src="./assets/registered-players.js"></script>
    <script src="./assets/registration.js"></script>
    <script src="./assets/announcer.js"></script>

        let S, seen = 0, reeling = false, mute = false, AC, ovT, shown = 0, reelTimer, RO = VIEW || !editingUnlocked, lastJ = '', LV = null;

        const liveNotice = message => { $('#connection-status').hidden = !message; $('#connection-status').textContent = message; };

        const mb = (t, p) => Math.max(0, purse(t) - ((p && p.f) || tp(t).some(x => x.f) ? 0 : S.cfg.reserve)), maxBid = t => mb(t, S.cur && pl(S.cur.pid)), roster = t => S.players.filter(p => p.team === t.id && !S.sales.includes(p.id)).concat(S.sales.map(pl).filter(p => p.team === t.id));

        function beep(f = 660, d = .12, ty = 'sine', v = .09) { if (mute) return; try { AC = AC || new AudioContext(); const o = AC.createOscillator(), g = AC.createGain(); o.type = ty; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.stop(AC.currentTime + d) } catch (e) { } }
        function toggleSound() { mute = !mute; if (mute) auctionAnnouncer.stop(); render(); }

        function sold() { if (!canEdit()) return; const c = S.cur; if (!c || c.lead === null || slots(S.teams[c.lead]) <= 0) return; const p = pl(c.pid); finishRegistrationPrice(p); p.team = c.lead; p.price = c.bid; p.st = 's'; S.sales.push(p.id); S.ev = { k: 'sold', pid: p.id, t: c.lead, price: c.bid, ts: Date.now() }; S.cur = null; save(); render() }
        function unsold() { if (!canEdit()) return; const c = S.cur; if (!c) return; const p = pl(c.pid); finishRegistrationPrice(p); p.st = 'u'; S.ev = { k: 'unsold', pid: p.id, t: -1, price: 0, ts: Date.now() }; S.cur = null; save(); render() }
        function undoBid() { if (!canEdit()) return; const c = S.cur; if (!c || !c.hist.length) return; c.hist.shift(); if (c.hist.length) { c.lead = c.hist[0][0]; c.bid = c.hist[0][1] } else { c.lead = null; c.bid = pl(c.pid).base } save(); render() }
